    rel="stylesheet"
  >

  <style>
    @font-face {
      font-family: "Aubrey";
      src: url("fonts/AUBREY1__.woff2") format("woff2");
      font-style: normal;
      font-weight: 400;
      font-display: swap;
    }

    :root {
      --wine: #6E1413;
      --wine-dark: #55100F;
      --river: #385D6B;
      --river-dark: #294A55;
      --oat: #E7DDCD;
      --oat-soft: #F5F1EA;
      --warm-white: #FCFBF8;
      --white: #FFFFFF;
      --ink: #2A2926;
      --body: #5B5751;
      --muted: #7A746E;
      --border: #E9E2D9;
      --max: 1320px;
      --page: 1120px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--warm-white);
      color: var(--ink);
      font-family: "DM Sans", sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    img { display: block; max-width: 100%; }
    a { color: inherit; }
    button, input, textarea, select { font: inherit; }

    .container {
      width: min(88%, var(--max));
      margin: 0 auto;
    }

    .page-inner {
      width: min(88%, var(--page));
      margin: 0 auto;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--river);
      font-size: 10px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }

    /* HEADER */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(252, 251, 248, 0.98);
      border-bottom: 1px solid transparent;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .site-header.scrolled {
      border-color: rgba(233, 226, 217, 0.92);
      box-shadow: 0 7px 25px rgba(42, 41, 38, 0.045);
    }

    .nav-wrap {
      width: min(88%, var(--max));
      min-height: 98px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      gap: 28px;
      transition: min-height 0.2s ease;
    }

    .site-header.scrolled .nav-wrap {
      min-height: 80px;
    }

    .brand-logo {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .brand-logo img {
      width: 190px;
      height: auto;
      transition: width 0.2s ease;
    }

    .site-header.scrolled .brand-logo img {
      width: 170px;
    }

    .main-nav {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav-link {
      padding: 11px 10px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
    }

    .nav-link:hover,
    .nav-link:focus-visible,
    .nav-link.active {
      color: var(--wine);
      font-weight: 700;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .client-link {
      color: var(--river);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    .waitlist-button {
      min-height: 45px;
      padding: 0 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9px;
      background: var(--wine);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
    }

    /* MOBILE NAV */

    .menu-toggle {
      display: none;
      width: 44px;
      height: 44px;
      margin-left: auto;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 5px;
    }

    .menu-toggle span {
      width: 21px;
      height: 2px;
      border-radius: 10px;
      background: var(--ink);
      transition: transform 0.22s ease, opacity 0.22s ease;
    }

    .menu-toggle.open span:nth-child(1) {
      transform: translateY(7px) rotate(45deg);
    }

    .menu-toggle.open span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.open span:nth-child(3) {
      transform: translateY(-7px) rotate(-45deg);
    }

    .mobile-menu {
      max-height: 0;
      overflow: hidden;
      opacity: 0;
      background: var(--warm-white);
      transition: max-height 0.35s ease, opacity 0.22s ease;
    }

    .mobile-menu.open {
      max-height: 700px;
      opacity: 1;
    }

    .mobile-menu-inner {
      width: 89%;
      margin: 0 auto;
      padding: 5px 0 28px;
    }

    .mobile-menu a {
      display: block;
      padding: 15px 2px;
      border-bottom: 1px solid var(--border);
      color: var(--ink);
      font-size: 17px;
      font-weight: 500;
      text-decoration: none;
    }

    .mobile-menu .mobile-client {
      margin-top: 8px;
      border-bottom: 0;
      color: var(--river);
      font-weight: 700;
    }

    .mobile-menu .mobile-waitlist {
      margin-top: 8px;
      padding: 15px 20px;
      border: 0;
      border-radius: 10px;
      background: var(--wine);
      color: #fff;
      text-align: center;
      font-weight: 700;
    }

    /* HERO */

    .waitlist-hero {
      position: relative;
      overflow: hidden;
      padding: 72px 0 68px;
      background: var(--river);
    }

    .waitlist-hero::after {
      content: "";
      position: absolute;
      right: 18px;
      bottom: -10px;

      width: 470px;
      height: 315px;

      background:
        url("assets/dog1.png")
        right bottom / contain
        no-repeat;

      opacity: 0.50;

      pointer-events: none;
    }

    .waitlist-hero-inner {
      position: relative;
      z-index: 1;

      width: min(88%, 930px);
      margin: 0 auto;
    }

    .waitlist-hero .eyebrow {
      color: rgba(255,255,255,0.76);
    }

    .waitlist-hero h1 {
      max-width: 760px;
      margin: 0;
      color: #fff;
      font-family: "Aubrey", serif;
      font-size: clamp(53px, 4.2vw, 67px);
      font-weight: 400;
      line-height: 0.96;
    }

    .waitlist-hero p:last-child {
      max-width: 780px;
      margin: 21px 0 0;
      color: rgba(255,255,255,0.88);
      font-size: 17px;
      line-height: 1.72;
    }

    /* FORM AREA */

    .waitlist-section {
      padding: 68px 0 76px;
      background: #fff;
    }

    .waitlist-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.42fr) minmax(280px, 0.58fr);
      gap: 82px;
      align-items: start;
    }

    .waitlist-form {
      min-width: 0;
    }

    fieldset {
      margin: 0;
      padding: 0 0 42px;
      border: 0;
    }

    fieldset + fieldset {
      padding-top: 42px;
      border-top: 1px solid var(--border);
    }

    legend {
      width: 100%;
      margin: 0 0 25px;
      padding: 0;
      color: var(--wine);
      font-family: "Aubrey", serif;
      font-size: 34px;
      line-height: 1;
    }

    .field-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px 24px;
    }

    .field {
      min-width: 0;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label,
    .field-label {
      display: block;
      margin: 0 0 8px;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.45;
      font-weight: 700;
    }

    .optional {
      margin-left: 4px;
      color: var(--muted);
      font-weight: 400;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    select,
    textarea {
      width: 100%;
      min-height: 52px;
      padding: 12px 14px;
      border: 1px solid #D7D0C7;
      border-radius: 8px;
      background: var(--warm-white);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.5;
      outline: none;
      transition: border-color 0.18s ease, box-shadow 0.18s ease;
    }

    textarea {
      min-height: 126px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: var(--river);
      box-shadow: 0 0 0 4px rgba(56,93,107,0.09);
    }

    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 16px;
    }

    .choice-grid.days {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .choice {
      min-height: 46px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 9px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--warm-white);
      color: var(--body);
      font-size: 14px;
      line-height: 1.4;
      cursor: pointer;
    }

    .choice input {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      accent-color: var(--wine);
    }

    .choice:hover {
      border-color: rgba(56,93,107,0.38);
      background: #fff;
    }

    .choice:has(input:checked) {
      border-color: rgba(110,20,19,0.42);
      background: rgba(110,20,19,0.035);
    }

    .field-help {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .acknowledgement {
      margin-top: 3px;
      padding: 20px 22px;
      border-left: 4px solid var(--wine);
      background: linear-gradient(90deg, rgba(110,20,19,0.055), var(--oat-soft));
    }

    .acknowledgement .choice {
      padding: 0;
      border: 0;
      background: transparent;
      align-items: flex-start;
    }

    .form-actions {
      margin-top: 28px;
    }

    .submit-button {
      min-height: 52px;
      padding: 0 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 9px;
      background: var(--wine);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s ease, transform 0.18s ease;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      background: var(--wine-dark);
      transform: translateY(-1px);
    }

    .submit-button[disabled] {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .form-status {
      margin: 14px 0 0;
      color: var(--body);
      font-size: 14px;
      line-height: 1.6;
    }

    .form-status.success {
      color: var(--river-dark);
      font-weight: 600;
    }

    .form-status.error {
      color: var(--wine);
      font-weight: 600;
    }

    .honeypot {
      position: absolute !important;
      left: -9999px !important;
      width: 1px !important;
      height: 1px !important;
      overflow: hidden !important;
    }

    /* SIDE COPY */

    .waitlist-aside {
      position: sticky;
      top: 116px;
      padding-left: 24px;
      border-left: 3px solid var(--oat);
    }

    .waitlist-aside h2 {
      margin: 0;
      color: var(--wine);
      font-family: "Aubrey", serif;
      font-size: 34px;
      font-weight: 400;
      line-height: 1;
    }

    .waitlist-aside p {
      margin: 17px 0 0;
      color: var(--body);
      font-size: 15px;
      line-height: 1.72;
    }

    .waitlist-aside a {
      margin-top: 20px;
      display: inline-flex;
      color: var(--river);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .waitlist-aside a:hover,
    .waitlist-aside a:focus-visible {
      color: var(--wine);
    }

    /* SUCCESS PANEL */

    .success-panel {
      display: none;
      padding: 34px 36px;
      border-radius: 10px;
      background: var(--oat-soft);
    }

    .success-panel.show {
      display: block;
    }

    .success-panel h2 {
      margin: 0;
      color: var(--wine);
      font-family: "Aubrey", serif;
      font-size: 39px;
      font-weight: 400;
      line-height: 1;
    }

    .success-panel p {
      margin: 16px 0 0;
      color: var(--body);
      font-size: 16px;
      line-height: 1.7;
    }

    .success-panel a {
      margin-top: 20px;
      display: inline-flex;
      color: var(--river);
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    /* FOOTER */

    .site-footer {
      padding: 46px 0 25px;
      background: #fff;
      border-top: 1px solid var(--border);
    }

    .footer-main {
      display: grid;
      grid-template-columns: 0.85fr 1.65fr;
      gap: 90px;
      align-items: start;
    }

    .footer-brand-name {
      margin: 0;
      color: var(--wine);
      font-family: "Aubrey", serif;
      font-size: 32px;
      font-weight: 400;
      line-height: 1;
    }

    .footer-brand-type {
      margin: 6px 0 0;
      color: var(--river);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    .footer-tagline {
      margin: 20px 0 0;
      color: var(--ink);
      font-family: "Aubrey", serif;
      font-size: 24px;
      font-weight: 400;
      line-height: 1.05;
    }

    .footer-details {
      display: grid;
      grid-template-columns: 1.1fr 0.8fr 1.2fr;
      gap: 30px;
    }

    .footer-detail-label {
      display: block;
      margin-bottom: 5px;
      color: var(--river);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .footer-detail-value,
    .footer-detail-value a {
      color: var(--body);
      font-size: 13px;
      line-height: 1.55;
      text-decoration: none;
    }

    .footer-links {
      display: flex;
      flex-wrap: wrap;
      gap: 7px 15px;
    }

    .footer-links a {
      color: var(--body);
      font-size: 13px;
      text-decoration: none;
    }

    .footer-detail-value a:hover,
    .footer-detail-value a:focus-visible,
    .footer-links a:hover,
    .footer-links a:focus-visible {
      color: var(--wine);
    }

    .footer-bottom {
      margin-top: 34px;
      padding-top: 18px;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 11px;
    }

    .footer-bottom-location {
      color: var(--river);
      font-weight: 600;
    }

    /* RESPONSIVE */

    @media (max-width: 1120px) {
      .main-nav,
      .nav-actions {
        display: none;
      }

      .menu-toggle {
        display: flex;
      }

      .nav-wrap,
      .site-header.scrolled .nav-wrap {
        min-height: 82px;
      }

      .brand-logo img,
      .site-header.scrolled .brand-logo img {
        width: 170px;
      }

      .waitlist-grid {
        gap: 56px;
      }
    }

    @media (max-width: 830px) {
      .waitlist-grid {
        grid-template-columns: 1fr;
        gap: 46px;
      }

      .waitlist-aside {
        position: static;
        max-width: none;
        padding: 32px 0 0;
        border-left: 0;
        border-top: 1px solid var(--border);
      }
    }

    @media (max-width: 760px) {
      .waitlist-hero::after {
        right: -25px;
        bottom: -8px;

        width: 340px;
        height: 230px;

        opacity: 0.32;
      }
    }

    @media (max-width: 620px) {
      .container,
      .nav-wrap,
      .page-inner {
        width: 89%;
      }

      .nav-wrap,
      .site-header.scrolled .nav-wrap {
        min-height: 72px;
      }

      .brand-logo img,
      .site-header.scrolled .brand-logo img {
        width: 145px;
      }

      .waitlist-hero {
        padding: 48px 0 52px;
      }

      .waitlist-hero::after {
        right: -42px;
        bottom: -8px;

        width: 300px;
        height: 205px;

        opacity: 0.30;
      }

      .waitlist-hero-inner {
        width: 89%;
      }

      .waitlist-hero h1 {
        font-size: 45px;
      }

      .waitlist-hero p:last-child {
        margin-top: 17px;
        font-size: 16px;
        line-height: 1.65;
      }

      .waitlist-section {
        padding: 50px 0 58px;
      }

      fieldset {
        padding-bottom: 34px;
      }

      fieldset + fieldset {
        padding-top: 34px;
      }

      legend {
        margin-bottom: 21px;
        font-size: 31px;
      }

      .field-grid {
        grid-template-columns: 1fr;
        gap: 20px;
      }

      .field.full {
        grid-column: auto;
      }

      .choice-grid,
      .choice-grid.days {
        grid-template-columns: 1fr;
      }

      .submit-button {
        width: 100%;
      }

      .site-footer {
        padding: 38px 0 23px;
      }

      .footer-main {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .footer-brand-name {
        font-size: 29px;
      }

      .footer-tagline {
        margin-top: 17px;
        font-size: 22px;
      }

      .footer-details {
        grid-template-columns: 1fr 1fr;
        gap: 22px 18px;
      }

      .footer-details > div:last-child {
        grid-column: 1 / -1;
      }

      .footer-bottom {
        margin-top: 27px;
        padding-top: 16px;
        flex-direction: column;
        gap: 6px;
        align-items: flex-start;
      }
    }

    @media (max-width: 390px) {
      .waitlist-hero h1 {
        font-size: 42px;
      }

      .footer-details {
        grid-template-columns: 1fr;
      }

      .footer-details > div:last-child {
        grid-column: auto;
      }
    }

    /* ACCESSIBILITY */

    a:focus-visible,
    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible {
      outline: 3px solid rgba(56,93,107,0.42);
      outline-offset: 4px;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }

    /* FINAL SHARED FOOTER */

    .footer-main {
      display: grid !important;
      grid-template-columns: 1.65fr 0.85fr !important;
      gap: 76px !important;
      align-items: start !important;
    }

    .footer-brand {
      justify-self: end !important;
